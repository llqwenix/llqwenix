<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiquidMusic Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0f0a 0%, #0a2e0a 25%, #0a1a0a 50%, #0d2e0d 75%, #0a0f0a 100%);
            min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .login-container {
            max-width: 400px; margin: 100px auto; background: rgba(10,20,10,0.95);
            backdrop-filter: blur(10px); border-radius: 20px; padding: 40px;
            border: 1px solid rgba(0,255,0,0.2);
        }
        .login-container h2 { text-align: center; margin-bottom: 30px; color: #00ff88; }
        .login-container input {
            width: 100%; padding: 12px; margin-bottom: 20px;
            background: rgba(0,20,0,0.8); border: 1px solid rgba(0,255,0,0.3);
            border-radius: 10px; color: #00ff88;
        }
        .login-container button {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #0a4d0a, #00aa44);
            color: white; border: none; border-radius: 10px; cursor: pointer;
        }
        .admin-panel { display: none; background: rgba(10,20,10,0.95); border-radius: 20px; padding: 20px; }
        h1 { text-align: center; margin-bottom: 30px; color: #00ff88; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(0,255,0,0.2); padding-bottom: 10px; }
        .tab-btn { background: transparent; color: #00aa66; border: 1px solid rgba(0,255,0,0.3); border-radius: 8px; padding: 10px 20px; cursor: pointer; }
        .tab-btn.active { background: linear-gradient(135deg, #0a4d0a, #00aa44); color: white; }
        .add-song-form, .add-news-form { background: rgba(0,20,0,0.6); border-radius: 15px; padding: 20px; margin-bottom: 30px; border: 1px solid rgba(0,255,0,0.2); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #00aa66; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; background: rgba(0,20,0,0.8); border: 1px solid rgba(0,255,0,0.3); border-radius: 8px; color: #00ff88; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-primary { background: linear-gradient(135deg, #0a4d0a, #00aa44); color: white; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; }
        .btn-danger { background: linear-gradient(135deg, #4a0a0a, #aa2200); }
        .song-item, .news-item { background: rgba(0,20,0,0.6); border-radius: 15px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 20px; }
        .song-info, .news-info { flex: 1; }
        .song-title, .news-title { font-size: 16px; font-weight: bold; color: #00ff88; }
        .song-artist, .news-date { color: #00aa66; font-size: 13px; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: rgba(0,30,0,0.95); color: #00ff88; padding: 12px 24px; border-radius: 10px; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
<div class="container">
    <div id="loginContainer" class="login-container">
        <h2>🔐 LiquidMusic Admin</h2>
        <input type="password" id="passwordInput" placeholder="Введите пароль">
        <button onclick="checkLogin()">Войти</button>
    </div>
    <div id="adminPanel" class="admin-panel">
        <h1>🎵 LiquidMusic Admin Panel</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('songs')">🎵 Песни</button>
            <button class="tab-btn" onclick="showTab('news')">📰 Новости</button>
        </div>
        <div id="songsTab">
            <div class="add-song-form">
                <h3>➕ Добавить песню</h3>
                <div class="form-row">
                    <div class="form-group"><label>Название *</label><input type="text" id="songTitle"></div>
                    <div class="form-group"><label>Автор *</label><input type="text" id="songArtist"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Альбом</label><input type="text" id="songAlbum"></div>
                    <div class="form-group"><label>MP3 ссылка *</label><input type="text" id="songUrl"></div>
                </div>
                <div class="form-group"><label>Обложка</label><input type="text" id="coverUrl"></div>
                <button class="btn-primary" onclick="addSong()">➕ Добавить</button>
                <button class="btn-primary btn-danger" onclick="clearAllSongs()">🗑 Очистить всё</button>
            </div>
            <div class="songs-list"><h3>📋 Список песен</h3><div id="songsList"></div></div>
        </div>
        <div id="newsTab" style="display:none;">
            <div class="add-news-form">
                <h3>📰 Добавить новость</h3>
                <div class="form-group"><label>Заголовок *</label><input type="text" id="newsTitle"></div>
                <div class="form-group"><label>Текст *</label><textarea id="newsContent" rows="4"></textarea></div>
                <div class="form-group"><label>Картинка</label><input type="text" id="newsImage"></div>
                <button class="btn-primary" onclick="addNews()">📰 Опубликовать</button>
                <button class="btn-primary btn-danger" onclick="clearAllNews()">🗑 Очистить всё</button>
            </div>
            <div class="news-list"><h3>📰 Все новости</h3><div id="newsList"></div></div>
        </div>
    </div>
</div>
<script>
    const ADMIN_PASSWORD = "admin123";
    let songs = [], news = [];
    
    function checkLogin() {
        if (document.getElementById('passwordInput').value === ADMIN_PASSWORD) {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadSongs(); loadNews();
            showToast('Вход выполнен!');
        } else alert('Неверный пароль!');
    }
    
    function loadSongs() { const s = localStorage.getItem('liquidMusicSongs'); if(s) songs = JSON.parse(s); renderSongs(); }
    function saveSongs() { localStorage.setItem('liquidMusicSongs', JSON.stringify(songs)); }
    function addSong() {
        const title = document.getElementById('songTitle').value.trim();
        const artist = document.getElementById('songArtist').value.trim();
        const album = document.getElementById('songAlbum').value.trim();
        const mp3Url = document.getElementById('songUrl').value.trim();
        const coverUrl = document.getElementById('coverUrl').value.trim();
        if(!title || !artist || !mp3Url) { alert('Заполните поля!'); return; }
        songs.unshift({ id: Date.now(), title, artist, album: album || 'Без альбома', mp3Url, coverUrl: coverUrl || null });
        saveSongs(); renderSongs(); clearSongForm(); showToast('Песня добавлена!');
    }
    function clearSongForm() {
        document.getElementById('songTitle').value = '';
        document.getElementById('songArtist').value = '';
        document.getElementById('songAlbum').value = '';
        document.getElementById('songUrl').value = '';
        document.getElementById('coverUrl').value = '';
    }
    function deleteSong(id) { if(confirm('Удалить?')) { songs = songs.filter(s => s.id !== id); saveSongs(); renderSongs(); showToast('Удалено'); } }
    function clearAllSongs() { if(confirm('Удалить всё?')) { songs = []; saveSongs(); renderSongs(); showToast('Все песни удалены'); } }
    function renderSongs() {
        const c = document.getElementById('songsList');
        if(!songs.length) { c.innerHTML = '<p style="color:#008844;">🌿 Нет песен</p>'; return; }
        c.innerHTML = songs.map(s => `<div class="song-item"><div class="song-info"><div class="song-title">${escapeHtml(s.title)}</div><div class="song-artist">${escapeHtml(s.artist)}</div><div class="song-artist" style="font-size:10px;">💿 ${escapeHtml(s.album)}</div></div><button class="btn-primary btn-danger" onclick="deleteSong(${s.id})">🗑</button></div>`).join('');
    }
    
    function loadNews() { const n = localStorage.getItem('liquidMusicNews'); if(n) news = JSON.parse(n); renderNews(); }
    function saveNews() { localStorage.setItem('liquidMusicNews', JSON.stringify(news)); }
    function addNews() {
        const title = document.getElementById('newsTitle').value.trim();
        const content = document.getElementById('newsContent').value.trim();
        const imageUrl = document.getElementById('newsImage').value.trim();
        if(!title || !content) { alert('Заполните поля!'); return; }
        news.unshift({ id: Date.now(), title, content, imageUrl: imageUrl || null, date: new Date().toISOString() });
        saveNews(); renderNews(); clearNewsForm(); showToast('Новость добавлена!');
    }
    function clearNewsForm() {
        document.getElementById('newsTitle').value = '';
        document.getElementById('newsContent').value = '';
        document.getElementById('newsImage').value = '';
    }
    function deleteNews(id) { if(confirm('Удалить новость?')) { news = news.filter(n => n.id !== id); saveNews(); renderNews(); showToast('Новость удалена'); } }
    function clearAllNews() { if(confirm('Удалить всё?')) { news = []; saveNews(); renderNews(); showToast('Все новости удалены'); } }
    function renderNews() {
        const c = document.getElementById('newsList');
        if(!news.length) { c.innerHTML = '<p style="color:#008844;">📭 Нет новостей</p>'; return; }
        c.innerHTML = news.map(n => `<div class="news-item"><div class="news-info"><div class="news-title">📌 ${escapeHtml(n.title)}</div><div class="news-date">📅 ${new Date(n.date).toLocaleString()}</div><div style="font-size:12px; color:#008844;">${escapeHtml(n.content)}</div></div><button class="btn-primary btn-danger" onclick="deleteNews(${n.id})">🗑</button></div>`).join('');
    }
    
    function showTab(tab) {
        document.getElementById('songsTab').style.display = tab === 'songs' ? 'block' : 'none';
        document.getElementById('newsTab').style.display = tab === 'news' ? 'block' : 'none';
        document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (tab === 'songs' && i === 0) || (tab === 'news' && i === 1)));
    }
    
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function showToast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
    
    document.getElementById('passwordInput').addEventListener('keypress', function(e) { if(e.key === 'Enter') checkLogin(); });
</script>
</body>
</html>
