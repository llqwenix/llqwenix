<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LiquidMusic API</title>
</head>
<body>
<script>
    // API для песен
    if (window.location.search === '?api=songs') {
        const saved = localStorage.getItem('liquidMusicSongs');
        if (saved) {
            const songs = JSON.parse(saved);
            const apiData = songs.map(s => ({
                id: s.id,
                title: s.title,
                artist: s.artist,
                album: s.album,
                mp3Url: s.mp3Url,
                coverUrl: s.coverUrl
            }));
            document.write(JSON.stringify(apiData, null, 2));
        } else {
            document.write('[]');
        }
    }
    // API для новостей
    else if (window.location.search === '?api=news') {
        const saved = localStorage.getItem('liquidMusicNews');
        if (saved) {
            const news = JSON.parse(saved);
            document.write(JSON.stringify(news, null, 2));
        } else {
            document.write('[]');
        }
    }
    // Перенаправление на админ-панель
    else {
        window.location.href = 'admin.html';
    }
</script>
</body>
</html>
