<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiquidMusic Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0a0f0a 0%, #0a2e0a 25%, #0a1a0a 50%, #0d2e0d 75%, #0a0f0a 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(10, 20, 10, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.2);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 10px;
            font-size: 16px;
            color: #00ff88;
        }

        .login-container input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0a4d0a 0%, #00aa44 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 68, 0.3);
        }

        .admin-panel {
            display: none;
            background: rgba(10, 20, 10, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00ff88;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            font-size: 28px;
        }

        .add-song-form {
            background: rgba(0, 20, 0, 0.6);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 255, 0, 0.2);
        }

        .add-song-form h3 {
            margin-bottom: 20px;
            color: #00ff88;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #00aa66;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 8px;
            font-size: 14px;
            color: #00ff88;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .songs-list {
            margin-top: 30px;
        }

        .songs-list h3 {
            color: #00ff88;
            margin-bottom: 20px;
        }

        .song-item {
            background: rgba(0, 20, 0, 0.6);
            border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s;
        }

        .song-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 68, 0.2);
            border-color: rgba(0, 255, 0, 0.4);
        }

        .song-cover {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
        }

        .song-info {
            flex: 1;
        }

        .song-title {
            font-size: 16px;
            font-weight: 600;
            color: #00ff88;
        }

        .song-artist {
            color: #00aa66;
            font-size: 13px;
        }

        .song-actions {
            display: flex;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0a4d0a, #00aa44);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
        }

        .btn-danger {
            background: linear-gradient(135deg, #4a0a0a, #aa2200);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 30, 0, 0.95);
            backdrop-filter: blur(10px);
            color: #00ff88;
            padding: 12px 24px;
            border-radius: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            border: 1px solid rgba(0, 255, 0, 0.3);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .preview-image {
            margin-top: 10px;
        }

        .preview-image img {
            width: 80px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div id="loginContainer" class="login-container">
        <h2>🔐 LiquidMusic Admin</h2>
        <input type="password" id="passwordInput" placeholder="Введите пароль" onkeypress="if(event.key==='Enter') checkLogin()">
        <button onclick="checkLogin()">Войти</button>
    </div>

    <div id="adminPanel" class="admin-panel">
        <h1>🎵 LiquidMusic Admin Panel</h1>

        <div class="add-song-form">
            <h3>➕ Добавить новую песню</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Название песни *</label>
                    <input type="text" id="songTitle" placeholder="Введите название">
                </div>
                <div class="form-group">
                    <label>Автор/Исполнитель *</label>
                    <input type="text" id="songArtist" placeholder="Введите автора">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Альбом</label>
                    <input type="text" id="songAlbum" placeholder="Введите альбом">
                </div>
                <div class="form-group">
                    <label>Ссылка на MP3 файл *</label>
                    <input type="text" id="songUrl" placeholder="https://raw.githubusercontent.com/...">
                </div>
            </div>
            <div class="form-group">
                <label>Ссылка на обложку</label>
                <input type="text" id="coverUrl" placeholder="https://...">
                <div id="coverPreview" class="preview-image"></div>
            </div>
            <button class="btn-primary" onclick="addSong()">➕ Добавить песню</button>
            <button class="btn-primary btn-danger" onclick="clearAllSongs()" style="margin-left: 10px;">🗑 Очистить всё</button>
            <button class="btn-primary" onclick="exportToJSON()" style="margin-left: 10px;">📤 Экспорт JSON</button>
        </div>

        <div class="songs-list">
            <h3>📋 Список песен</h3>
            <div id="songsList"></div>
        </div>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "ilovegays";
    let songs = [];

    // === API ДЛЯ ПРИЛОЖЕНИЯ ===
    // Если открыть страницу с ?api=songs - отдаст JSON
    if (window.location.search === '?api=songs') {
        const saved = localStorage.getItem('liquidMusicSongs');
        if (saved) {
            const songsList = JSON.parse(saved);
            const apiData = songsList.map(s => ({
                id: s.id,
                title: s.title,
                artist: s.artist,
                album: s.album,
                mp3Url: s.mp3Url,
                coverUrl: s.coverUrl
            }));
            document.body.innerHTML = JSON.stringify(apiData, null, 2);
        } else {
            document.body.innerHTML = '[]';
        }
        // Останавливаем выполнение, чтобы не показывать админку
        throw new Error("API mode");
    }

    function checkLogin() {
        const password = document.getElementById('passwordInput').value;
        if (password === ADMIN_PASSWORD) {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadSongs();
            showToast('🌿 Вход выполнен успешно!');
        } else {
            alert('❌ Неверный пароль!');
        }
    }

    function loadSongs() {
        const saved = localStorage.getItem('liquidMusicSongs');
        if (saved) songs = JSON.parse(saved);
        renderSongsList();
    }

    function saveSongs() {
        localStorage.setItem('liquidMusicSongs', JSON.stringify(songs));
    }

    function previewCoverFromUrl() {
        const coverUrl = document.getElementById('coverUrl').value;
        const preview = document.getElementById('coverPreview');
        preview.innerHTML = '';
        if (coverUrl) {
            const img = document.createElement('img');
            img.src = coverUrl;
            img.onerror = () => { preview.innerHTML = '<span style="color:#00aa66;">❌ Не удалось загрузить</span>'; };
            preview.appendChild(img);
        }
    }

    document.getElementById('coverUrl').addEventListener('input', previewCoverFromUrl);

    function addSong() {
        const title = document.getElementById('songTitle').value.trim();
        const artist = document.getElementById('songArtist').value.trim();
        const album = document.getElementById('songAlbum').value.trim();
        const mp3Url = document.getElementById('songUrl').value.trim();
        const coverUrl = document.getElementById('coverUrl').value.trim();

        if (!title || !artist || !mp3Url) {
            alert('❌ Заполните обязательные поля!');
            return;
        }

        const song = {
            id: Date.now(),
            title: title,
            artist: artist,
            album: album || 'Без альбома',
            mp3Url: mp3Url,
            coverUrl: coverUrl || null,
            added: new Date().toISOString()
        };

        songs.unshift(song);
        saveSongs();
        renderSongsList();
        clearForm();
        showToast('✅ Песня добавлена!');
    }

    function clearForm() {
        document.getElementById('songTitle').value = '';
        document.getElementById('songArtist').value = '';
        document.getElementById('songAlbum').value = '';
        document.getElementById('songUrl').value = '';
        document.getElementById('coverUrl').value = '';
        document.getElementById('coverPreview').innerHTML = '';
    }

    function deleteSong(id) {
        if (confirm('🗑 Удалить эту песню?')) {
            songs = songs.filter(s => s.id !== id);
            saveSongs();
            renderSongsList();
            showToast('🗑 Песня удалена');
        }
    }

    function clearAllSongs() {
        if (confirm('⚠️ Удалить ВСЕ песни?')) {
            songs = [];
            saveSongs();
            renderSongsList();
            showToast('🗑 Все песни удалены');
        }
    }

    function renderSongsList() {
        const container = document.getElementById('songsList');
        if (songs.length === 0) {
            container.innerHTML = '<p style="text-align:center;color:#008844;">🌿 Нет добавленных песен</p>';
            return;
        }

        container.innerHTML = songs.map(song => `
            <div class="song-item">
                ${song.coverUrl ? `<img class="song-cover" src="${song.coverUrl}" onerror="this.style.display='none'">` : '<div style="width:60px; height:60px; background:#0a3a0a; border-radius:10px; display:flex;align-items:center;justify-content:center;">🎵</div>'}
                <div class="song-info">
                    <div class="song-title">${escapeHtml(song.title)}</div>
                    <div class="song-artist">${escapeHtml(song.artist)}</div>
                    <div class="song-artist" style="font-size:10px;">💿 ${escapeHtml(song.album)}</div>
                </div>
                <div class="song-actions">
                    <button class="btn-primary" onclick="playSongInBrowser('${song.mp3Url}', '${escapeHtml(song.title)}')">▶</button>
                    <button class="btn-primary btn-danger" onclick="deleteSong(${song.id})">🗑</button>
                </div>
            </div>
        `).join('');
    }

    function playSongInBrowser(url, title) {
        const audio = new Audio(url);
        audio.play();
        showToast(`🎵 Играет: ${title}`);
    }

    function exportToJSON() {
        const data = songs.map(s => ({ id: s.id, title: s.title, artist: s.artist, album: s.album, mp3Url: s.mp3Url, coverUrl: s.coverUrl }));
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'songs_export.json';
        a.click();
        showToast('📄 Экспорт завершен!');
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
</script>
</body>
</html>
